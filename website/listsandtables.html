<!DOCTYPE html>
<html lang="en">
    <body>
        <!-- odered lists  -->
         <ol>
            <br>
            <hr>
            <li>kill the nearest sibling</li>
            <li>kill the father ;the <u><b>KING</b></u></li>
            <li>capture the throne</li>

         </ol>
        <!-- unodered lists  -->
         <ul>
            <br>
            <hr>
            <li>aarav is great</li>
            <li>he is fabulous</li>
            <li>he is very funny and charming</li>

         </ul>
        <!-- description lists  -->
         <dl>
            <dt>HTML</dt>
            <dd>hyper text markup language</dd>
            <dt>CSS</dt>
            <dd>Cascading style sheets</dd>
         </dl>
        <!-- nested lists  -->
         <dl>
            <dt>backend</dt>
            <dd>
                <ul>
                    <li>python <ol>very nasty language</ol></li>
                    <li>java</li>
                </ul>
            </dd>
            <dt>frontend</dt>
            <dd>
                <ul>
                    <li>HTML</li>
                    <li>CSS</li>
                </ul>
            </dd>
         </dl>
    </body>
</html>
